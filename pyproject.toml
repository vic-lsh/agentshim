[project]
name = "agentshim"
version = "0.15.4"
description = "Provider-agnostic coding-agent CLI shims"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "tomli>=2 ; python_full_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "ruff==0.15.12",
    "tomli>=2 ; python_full_version < '3.11'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentshim"]

[tool.hatch.build.targets.sdist]
include = ["agentshim", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["agentshim", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Generated by scripts/generate_codex_protocol.py; the generator owns its layout.
exclude = ["agentshim/providers/codex/app_server/protocol.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "W",
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"agentshim/testing/contracts.py" = ["S101", "D102"]
"tests/**" = ["S101", "PLR2004", "D", "INP001", "TC001", "TC002", "TC003"]
"scripts/**" = ["T201"]
# These suites drive ~130 generated dataclasses generically (cls.from_wire, getattr
# over fields), so values are honestly dynamic.
"tests/unit/providers/codex/app_server/**" = ["ANN401"]
# A schema-to-code compiler has one branch per JSON Schema form and reports each
# unsupported form with its own message; splitting that up only hides the table.
"scripts/generate_codex_protocol.py" = ["C901", "PLR0911", "PLR0912", "TRY003"]

[tool.importlinter]
root_packages = ["agentshim"]

[[tool.importlinter.contracts]]
name = "Library layers depend inward"
type = "layers"
layers = [
    "agentshim.testing",
    "agentshim.runtime",
    "agentshim.oneshot",
    "agentshim.agent",
    "agentshim.session",
    "agentshim.providers",
    # ":" makes these non-independent siblings of one innermost layer:
    # execution raises the core error types, and neither may import outward.
    "agentshim.core : agentshim.execution",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs a real provider CLI; needs AGENTSHIM_E2E=1"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
