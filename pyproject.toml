[project]
name = "agentshim"
version = "0.6.0"
description = "Provider-agnostic coding-agent CLI shims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentshim"]
# Not yet ported to the 0.6 provider protocol; they do not import.
exclude = [
    "agentshim/codex",
    "agentshim/copilot",
    "agentshim/gemini",
    "agentshim/opencode",
]

[tool.hatch.build.targets.sdist]
include = ["agentshim", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PIE", "C4", "ERA", "B", "RUF010", "RUF013", "RUF100", "PT", "SIM", "RSE", "FURB", "A", "PERF401", "RET505", "TCH", "S602"]
ignore = ["SIM117", "SIM105", "SIM108", "PT009"]

[tool.ruff.lint.per-file-ignores]
# Tests annotate fixtures inline; a TYPE_CHECKING block per file is noise.
"tests/**" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs a real provider CLI; needs AGENTSHIM_E2E=1"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
