[project]
name = "agentshim"
version = "0.6.0"
description = "Provider-agnostic coding-agent CLI shims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "ruff==0.15.12",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentshim"]
# Not yet ported to the 0.6 provider protocol; they do not import.
exclude = [
    "agentshim/codex",
    "agentshim/copilot",
    "agentshim/gemini",
    "agentshim/opencode",
]

[tool.hatch.build.targets.sdist]
include = ["agentshim", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["agentshim", "tests", "scripts"]
# Not yet ported to the 0.6 provider protocol; same list as pyrightconfig.json.
extend-exclude = [
    "agentshim/codex",
    "agentshim/copilot",
    "agentshim/gemini",
    "agentshim/opencode",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "W",
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]
ignore = [
    "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "INP001", "TC001", "TC002", "TC003"]
"scripts/**" = ["T201"]

[tool.importlinter]
root_packages = ["agentshim"]

[[tool.importlinter.contracts]]
name = "Library layers depend inward"
type = "layers"
layers = [
    "agentshim.testing",
    "agentshim.agent",
    "agentshim.providers",
    # ":" makes these non-independent siblings of one innermost layer:
    # execution raises the core error types, and neither may import outward.
    "agentshim.core : agentshim.execution",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs a real provider CLI; needs AGENTSHIM_E2E=1"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
